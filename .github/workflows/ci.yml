name: CI - Integridade e Testes EUDR

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

jobs:
  validate:
    name: Validar Tipos, Testes e Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'pnpm'

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Checagem estática de tipos (TypeScript)
        run: pnpm run typecheck

      - name: Execução dos testes automatizados (Node Test Runner)
        run: pnpm test

      - name: Build de produção (Vinext / Next.js)
        run: pnpm run build
        env:
          NODE_ENV: production
